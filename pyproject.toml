[project]
name = "nsf-grant-intelligence"
version = "0.1.0"
description = "MCP server for searching and analyzing NSF awards via the public NSF Award API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nsf-grant-intelligence = "nsf_grant_intelligence.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
