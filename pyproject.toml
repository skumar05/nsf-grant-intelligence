[project]
name = "nsf-grant-intelligence"
version = "0.1.0"
description = "MCP server for searching and analyzing NSF awards via the public NSF Award API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3",
    "httpx>=0.28",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
eval = ["anthropic>=0.40"]

[project.scripts]
nsf-grant-intelligence = "nsf_grant_intelligence.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"
exclude = [".venv", ".venv-eval", ".venv-phoenix", ".agents"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Long lines here are an embedded HTML page and Markdown report tables.
"src/nsf_grant_intelligence/routes.py" = ["E501"]
"eval/answer_eval.py" = ["E501"]
